# ── DataSource (H2 in-memory, local development only) ─────────────────────────
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA dialect ───────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── H2 Console ────────────────────────────────────────────────────────────────
# Access at http://localhost:8080/h2-console when running with -Dspring.profiles.active=local
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Application ───────────────────────────────────────────────────────────────
app.base-url=http://localhost:8080
