# ── Server ────────────────────────────────────────────────────────────────────
# Bind to the port supplied by the host (Render injects $PORT); fall back to 8080 locally.
server.port=${PORT:8080}

# Trust X-Forwarded-* headers injected by Render's reverse proxy.
server.forward-headers-strategy=framework

# ── DataSource (PostgreSQL on Render) ─────────────────────────────────────────
# All three values are injected as environment variables; never hard-code credentials.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Keep the connection pool small to stay within Render's free-tier DB connection limit.
spring.datasource.hikari.maximum-pool-size=3

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# Automatically apply schema changes on startup (safe for early-stage projects).
spring.jpa.hibernate.ddl-auto=update

# Keep logs quiet in production; set to true temporarily when debugging queries.
spring.jpa.show-sql=false

# ── Application ───────────────────────────────────────────────────────────────
# Public base URL used when building shortened links (e.g. https://your-app.onrender.com).
app.base-url=${APP_BASE_URL}
