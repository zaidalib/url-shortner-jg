<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>LinkSnip — URL Shortener</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .brand-title { font-weight: 700; letter-spacing: -0.5px; }
        .recent-url { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand brand-title" href="/"><i class="bi bi-link-45deg"></i> LinkSnip</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <!-- Error alert (flash or inline) -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-circle-fill me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Shorten form -->
            <div class="card shadow-sm mb-4">
                <div class="card-body p-4">
                    <h5 class="card-title mb-3">Shorten a URL</h5>
                    <form th:action="@{/shorten}" method="post">

                        <div class="mb-3">
                            <label for="url" class="form-label">Long URL</label>
                            <input type="url" class="form-control" id="url" name="url"
                                   placeholder="https://example.com/very/long/path"
                                   th:value="${inputUrl}"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label for="alias" class="form-label">
                                Custom alias
                                <span class="text-muted fw-normal small">(optional)</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text text-muted small">linksnip.app/</span>
                                <input type="text" class="form-control" id="alias" name="alias"
                                       placeholder="my-link"
                                       th:value="${inputAlias}"
                                       pattern="[a-zA-Z0-9_\-]{1,20}"
                                       maxlength="20"/>
                            </div>
                            <div class="form-text">Letters, digits, hyphens, underscores — up to 20 characters.</div>
                        </div>

                        <div class="mb-4">
                            <label for="expiry" class="form-label">
                                Expiry
                                <span class="text-muted fw-normal small">(optional)</span>
                            </label>
                            <select class="form-select" id="expiry" name="expiry">
                                <option value="">Never expires</option>
                                <option value="1">1 day</option>
                                <option value="7">7 days</option>
                                <option value="30">30 days</option>
                                <option value="90">90 days</option>
                                <option value="365">1 year</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-scissors me-1"></i> Shorten
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Recent links table -->
            <div class="card shadow-sm" th:if="${recentLinks != null and !recentLinks.empty}">
                <div class="card-header bg-white fw-semibold">
                    <i class="bi bi-clock-history me-1"></i> Recent links
                </div>
                <div class="table-responsive">
                    <table class="table table-hover table-sm mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Short link</th>
                            <th>Original URL</th>
                            <th class="text-end">Clicks</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="link : ${recentLinks}">
                            <td>
                                <a th:href="@{'/' + ${link.code}}" th:text="${link.code}"
                                   class="text-primary text-decoration-none fw-medium"></a>
                            </td>
                            <td>
                                <a th:href="${link.originalUrl}"
                                   th:title="${link.originalUrl}"
                                   class="text-muted text-decoration-none recent-url"
                                   target="_blank" rel="noopener noreferrer"
                                   th:text="${link.originalUrl}"></a>
                            </td>
                            <td class="text-end">
                                <a th:href="@{'/stats/' + ${link.code}}"
                                   class="badge bg-secondary text-decoration-none"
                                   th:text="${link.clickCount}"></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmUn/0EUqSnnKZXfv5kiAhXTtPE"
        crossorigin="anonymous"></script>
</body>
</html>
