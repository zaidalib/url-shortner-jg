<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Link created — LinkSnip</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .brand-title { font-weight: 700; letter-spacing: -0.5px; }
        .short-url-box {
            font-size: 1.25rem;
            font-weight: 600;
            word-break: break-all;
        }
        #copyBtn.copied { background-color: #198754; border-color: #198754; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand brand-title" href="/"><i class="bi bi-link-45deg"></i> LinkSnip</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card shadow-sm mb-3">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4 text-success">
                        <i class="bi bi-check-circle-fill me-2"></i>Link created
                    </h5>

                    <!-- Short URL display + copy -->
                    <div class="mb-4">
                        <label class="form-label text-muted small text-uppercase fw-semibold">Your short link</label>
                        <div class="input-group">
                            <input type="text" class="form-control short-url-box"
                                   id="shortUrlInput"
                                   th:value="${shortUrl}"
                                   readonly/>
                            <button class="btn btn-outline-primary" type="button" id="copyBtn"
                                    onclick="copyShortUrl()">
                                <i class="bi bi-clipboard me-1"></i> Copy
                            </button>
                        </div>
                    </div>

                    <!-- QR code -->
                    <div class="text-center mb-4">
                        <label class="form-label text-muted small text-uppercase fw-semibold d-block mb-2">QR Code</label>
                        <img th:src="@{'/qr/' + ${mapping.code} + '.png'}"
                             alt="QR code for short link"
                             class="border rounded p-2 bg-white"
                             width="180" height="180"/>
                        <div class="mt-2">
                            <a th:href="@{'/qr/' + ${mapping.code} + '.png'}"
                               download="qr.png"
                               class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-download me-1"></i> Download QR
                            </a>
                        </div>
                    </div>

                    <!-- Action links -->
                    <div class="d-flex gap-2 flex-wrap">
                        <a th:href="${shortUrl}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                            <i class="bi bi-box-arrow-up-right me-1"></i> Open link
                        </a>
                        <a th:href="@{'/stats/' + ${mapping.code}}" class="btn btn-outline-secondary">
                            <i class="bi bi-bar-chart-line me-1"></i> View stats
                        </a>
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="bi bi-plus-lg me-1"></i> Shorten another
                        </a>
                    </div>
                </div>
            </div>

            <!-- Summary row -->
            <div class="card shadow-sm">
                <div class="card-body py-3 px-4">
                    <dl class="row mb-0 small">
                        <dt class="col-sm-4 text-muted">Original URL</dt>
                        <dd class="col-sm-8 text-break">
                            <a th:href="${mapping.originalUrl}" th:text="${mapping.originalUrl}"
                               target="_blank" rel="noopener noreferrer" class="text-decoration-none"></a>
                        </dd>
                        <dt class="col-sm-4 text-muted">Expires</dt>
                        <dd class="col-sm-8"
                            th:text="${mapping.expiresAt != null ? #temporals.format(mapping.expiresAt, 'dd MMM yyyy') : 'Never'}"></dd>
                    </dl>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmUn/0EUqSnnKZXfv5kiAhXTtPE"
        crossorigin="anonymous"></script>
<script>
    function copyShortUrl() {
        const input = document.getElementById('shortUrlInput');
        const btn   = document.getElementById('copyBtn');
        navigator.clipboard.writeText(input.value).then(() => {
            btn.innerHTML = '<i class="bi bi-check2 me-1"></i> Copied';
            btn.classList.add('copied', 'text-white');
            setTimeout(() => {
                btn.innerHTML = '<i class="bi bi-clipboard me-1"></i> Copy';
                btn.classList.remove('copied', 'text-white');
            }, 2000);
        }).catch(() => {
            input.select();
            document.execCommand('copy');
        });
    }
</script>
</body>
</html>
